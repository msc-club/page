    function syncRegistrationGamesStatus() {
        document.querySelectorAll('.game-checkbox').forEach(label => {
            const checkbox = label.querySelector('input');
            if(!checkbox) return;
            const gameCode = checkbox.value;
            
            let badge = label.querySelector('.status-badge');
            if(!badge) {
                badge = document.createElement('small');
                badge.className = 'status-badge';
                badge.style.marginLeft = '5px';
                label.appendChild(badge);
            }

            if(gameConfig[gameCode] && gameConfig[gameCode].status === 'inactive') {
                label.style.opacity = '0.5'; 
                label.style.pointerEvents = 'none'; 
                checkbox.disabled = true;
                checkbox.checked = false;
                badge.innerText = '(বন্ধ)';
                badge.style.color = 'red';
            } else {
                label.style.opacity = '1'; 
                label.style.pointerEvents = 'auto'; 
                checkbox.disabled = false;
                badge.innerText = '';
            }
        });
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(d => d.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        
        if(tabId === 'registration') {
            document.getElementById('tab-reg').classList.add('active');
            syncRegistrationGamesStatus();
            populateClassDropdown();
        }
        if(tabId === 'management') { document.getElementById('tab-mgmt').classList.add('active'); renderMgmt(); }
        if(tabId === 'results') { document.getElementById('tab-res').classList.add('active'); renderResults(); }
        if(tabId === 'settings') { 
            document.getElementById('tab-set').classList.add('active'); 
            renderSettingsUI(); renderArtSettings(); 
        }
        if(tabId === 'participants') { 
            document.getElementById('tab-part').classList.add('active'); 
            renderParticipants(); 
        }
        
        renderPlayerList();
    }

    let expectedRoleForLogin = '';

    function showLoginModal(roleType) {
        expectedRoleForLogin = roleType;
        if(roleType === 'judges') document.getElementById('loginModalTitle').innerText = 'বিচারক লগিন';
        else if(roleType === 'member') document.getElementById('loginModalTitle').innerText = 'সদস্য লগিন';
        else if(roleType === 'nyks') document.getElementById('loginModalTitle').innerText = 'NYKS লগিন';
        
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginModal').style.display = 'flex';
    }

    function closeLoginModal() {
        document.getElementById('loginModal').style.display = 'none';
    }

    function processLogin() {
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value.trim();

        if (expectedRoleForLogin === 'judges' && u === 'judges' && p === '12349') {
            SafeSession.setItem('role', 'admin');
            closeLoginModal();
            initApp();
        } else if (expectedRoleForLogin === 'member' && u === 'member' && p === '12349') {
            SafeSession.setItem('role', 'staff');
            closeLoginModal();
            initApp();
        } else if (expectedRoleForLogin === 'nyks' && u === 'nyks' && p === '12349') {

    async function fetchData() {
        if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("URL")) return;
        try {
            let res = await fetch(GOOGLE_SCRIPT_URL);
            let data = await res.json();
            
            if(data.participants) {
                participants = data.participants;
                if(data.config) {
                    if(data.config.gameConfig) {
                        gameConfig = data.config.gameConfig;
                        SafeStorage.setItem('gameConfig_v10', JSON.stringify(gameConfig));
                    }
                    if(data.config.artConfig) {
                        artConfig = data.config.artConfig;
                        SafeStorage.setItem('artConfig_v1', JSON.stringify(artConfig));
                    }
                }
            } else {
                participants = data; 
            }
        } catch(e) { 
            participants = JSON.parse(SafeStorage.getItem('db_v8')) || []; 
        }

        syncRegistrationGamesStatus(); 
        
        if(SafeSession.getItem('role') === 'nyks') {
            switchTab('results');
        } else if(document.getElementById('registration').classList.contains('active')) {
            switchTab('registration');
        }
    }

    async function pushData(action, payload, retryCount = 0) {
        if(action === 'register') participants.push(payload.data);
        else if(action === 'updateScore') {
            let p = participants.find(x => x.id == payload.id);
            if(p) { if(!p.scores) p.scores={}; p.scores[payload.gameCode] = payload.score; }
        }
        else if(action === 'saveImage') {
            let p = participants.find(x => x.id == payload.id);
            if(p) { p.artImage = payload.url; }
        }
        else if(action === 'editName') {
            let p = participants.find(x => x.id == payload.id);
            if(p) { p.name = payload.newName; }
        }
        else if(action === 'deletePlayer') participants = participants.filter(x => x.id !== payload.id);
        else if(action === 'editPlayer') {
             let p = participants.find(x => x.id == payload.id);
             if(p) { p.name = payload.newName; p.games = payload.newGames; }
        }
        else if(action === 'approveNYKS') {
             let p = participants.find(x => x.id == payload.id);
             if(p) { 
                 if(!p.nyksApproved) p.nyksApproved = {};
                 p.nyksApproved[payload.gameCode] = true;
             }
        }
        
        else if(action === 'rejectNYKS') { let p = participants.find(x => x.id == payload.id); if(p && p.nyksApproved) { delete p.nyksApproved[payload.gameCode]; } }
        // pushData ফাংশনের ভিতরে if-else ব্লকে এটি যোগ করুন:
else if(action === 'editFullPlayer') {
     let p = participants.find(x => x.id == payload.id);
     if(p) {
         p.name = payload.name;
         if(payload.mobile !== undefined) p.mobile = payload.mobile;
         if(payload.address !== undefined) p.address = payload.address;
         if(payload.class) {
             p.class = payload.class;
             // ক্লাস বদলালে গ্রুপ এবং কনসেপ্টও আপডেট করা হলো
             const gInfo = getArtGroupInfo(payload.class);
             if(gInfo) {
                 p.groupKey = gInfo.key;
                 p.groupLabel = gInfo.label;
                 p.concept = gInfo.concept;
             }
         }
     }
}
        SafeStorage.setItem('db_v8', JSON.stringify(participants));

        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("URL")) {
            console.warn("Google Script URL is missing or invalid.");
            return;
        }

        const dataToSend = { action: action, ...payload };

        try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                redirect: "follow",
                body: JSON.stringify(dataToSend)
            });
            
            const result = await response.json();
            if(result.status === 'success') {
                console.log("Success:", action);
            } else {
                console.error("Server Error:", result.message);
                if(action !== 'checkUpdates') alert("সার্ভার এরর: " + result.message);
            }
        } catch (error) {
            console.error("Push Error:", error);
            if (retryCount < 1) {
                console.log("Retrying pushData...");
                setTimeout(() => pushData(action, payload, retryCount + 1), 1000);
            } else {
                if(action !== 'checkUpdates') alert("ডাটা সার্ভারে সেভ হয়নি! ইন্টারনেট চেক করুন বা স্ক্রিপ্ট পারমিশন (Everyone) আছে কিনা দেখুন।\nError: " + error.message);
            }
        }
    }

    function getCustomTransliteration(inputText, googleSuggestion) {
        const inputWords = inputText.trim().split(/\s+/);
        const googleWords = googleSuggestion.trim().split(/\s+/);
        if (inputWords.length !== googleWords.length) return googleSuggestion;
        const correctedWords = inputWords.map((word, index) => {
            const lowerWord = word.toLowerCase();
            if (bengaliSurnameDictionary[lowerWord]) return bengaliSurnameDictionary[lowerWord];
            return googleWords[index];
        });
        return correctedWords.join(" ");
    }

    function compressImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; 
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.4)); 
                };
                img.onerror = (err) => reject(err);
            };
            reader.onerror = (err) => reject(err);
        });
    }

  function renderResults() {
        const game = document.getElementById('resGameSelector').value;
        // নিচে searchVal লাইনটি যোগ করা হয়েছে
        const searchVal = document.getElementById('resSearch') ? document.getElementById('resSearch').value.toLowerCase() : '';
        const tbody = document.getElementById('resBody');
        tbody.innerHTML = '';
        document.getElementById('artResSubFilterDiv').style.display = (game === 'art_comp') ? 'block' : 'none';
        if(!game) return;

        const conf = gameConfig[game];
        const currentRole = SafeSession.getItem('role');
        
        // ব্র্যাকেট এবং রিটার্নের ভুল ঠিক করা হয়েছে
        let list = participants.filter(p => {
            const hasScore = p.scores && p.scores[game];
            const hasImage = (game === 'art_comp' && p.artImage);
            return (hasScore || hasImage) && p.name.toLowerCase().includes(searchVal); 
        });

        if(game === 'art_comp') {
             const filter = document.getElementById('artResGroupFilter').value;
             if(filter !== 'all') list = list.filter(p => p.groupKey === filter);
        }

        document.getElementById('resTitle').innerText = conf.label + " - চূড়ান্ত তালিকা";
        
        list.sort((a, b) => {
            let sa = (a.scores && a.scores[game]) ? a.scores[game] : '';
            let sb = (b.scores && b.scores[game]) ? b.scores[game] : '';

            if(!sa && !sb) return 0;
            if(!sa) return 1; 
            if(!sb) return -1;

            if(game === 'musical_chair' || game === 'sajo' || game === 'art_comp') {
                const rankMap = { '1st':1, '2nd':2, '3rd':3 };
                const ra = (sa.includes('#') ? sa.split('#')[0] : sa).toLowerCase();
                const rb = (sb.includes('#') ? sb.split('#')[0] : sb).toLowerCase();
                return (rankMap[ra] || 99) - (rankMap[rb] || 99);
            }

// ১. Approve ফাংশন
async function approveByNyks(id, game) {
    if(confirm("আপনি কি এই প্রতিযোগীকে সার্টিফিকেট প্রদানের জন্য Approve করতে চান?")) {
        await pushData('approveNYKS', { id: id, gameCode: game });
        renderResults(); // টেবিল সাথে সাথে আপডেট হবে
    }
}

function rejectByNyks(id, game) { 
    if(confirm("আপনি কি এই অ্যাপ্রুভালটি বাতিল (Reject) করতে চান?")) { 
        // ১. সাথে সাথে লোকাল ডাটা মুছে ফেলা 
        let p = participants.find(x => x.id == id); 
        if(p && p.nyksApproved) { 
            delete p.nyksApproved[game]; 
        } 
        // ২. চোখের পলকে টেবিল আপডেট করে সার্টিফিকেট গায়েব করে দেওয়া 
        renderResults(); 
        // ৩. ব্যাকগ্রাউন্ডে ডাটাবেজ থেকে ডিলিট হতে থাকবে 
        pushData('rejectNYKS', { id: id, gameCode: game }); 
    } 
}

// ৩. Reset Score ফাংশন (রেজাল্ট মুছে ফেলা এবং অ্যাপ্রুভ স্ট্যাটাস ক্লিয়ার করা)

        // ফলাফল খালি করে দেওয়া
        await pushData('updateScore', { id: id, gameCode: game, score: "" });
        
        // যদি NYKS থেকে অ্যাপ্রুভ হয়ে থাকে, তবে সেটাও মুছে দেওয়া

}

    let videoStream = null;
    let currentCameraFacingMode = 'environment'; 
    let targetPlayerIdForCamera = null;

    async function openCamera(playerId) {
        targetPlayerIdForCamera = playerId;
        document.getElementById('cameraModal').style.display = 'flex';
        await startCameraStream();
    }

    async function startCameraStream() {
        const video = document.getElementById('cameraFeed');
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: currentCameraFacingMode,
                    width: { ideal: 640 }, 
                    height: { ideal: 480 }
                }
            });
            video.srcObject = videoStream;
        } catch (err) {
            alert("ক্যামেরা অ্যাক্সেস পাওয়া যাচ্ছে না! দয়া করে পারমিশন দিন।");
            closeCamera();
        }
    }

    function switchCamera() {
        currentCameraFacingMode = (currentCameraFacingMode === 'environment') ? 'user' : 'environment';
        startCameraStream();
    }

    function closeCamera() {
        document.getElementById('cameraModal').style.display = 'none';
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
    }

    function capturePhoto() {
        const video = document.getElementById('cameraFeed');
        const canvas = document.getElementById('cameraCanvas');
        
        const MAX_WIDTH = 800; 
        let width = video.videoWidth;
        let height = video.videoHeight;

        if (width > MAX_WIDTH) {
            height = height * (MAX_WIDTH / width);
            width = MAX_WIDTH;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, width, height);
        
        const imgData = canvas.toDataURL('image/jpeg', 0.5);
        
        if(confirm("ছবিটি কি আপলোড করবেন?")) {
            uploadCapturedImage(imgData, targetPlayerIdForCamera);
            closeCamera();
        }
    }

    async function uploadCapturedImage(base64Data, id) {
        const label = document.getElementById(`cam_btn_${id}`);
        const originalText = label ? label.innerHTML : "📷 ছবি";
        
        if(label) {
            label.innerHTML = "আপলোড...";
            label.style.background = "#ffa000";
        }

        try {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("URL")) {
                throw new Error("Google Script URL সমস্যা!");
            }

            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                redirect: "follow",
                body: JSON.stringify({
                    action: 'uploadImage',
                    imageName: `art_${id}_${Date.now()}.jpg`,
                    imageData: base64Data
                })
            });
            
            const data = await res.json();

            if (data.status === 'success') {
                await pushData('saveImage', { id: id, url: data.imageUrl });
                renderMgmt(); 
                alert("✅ ছবি সফলভাবে আপলোড হয়েছে!");
            } else { 
                throw new Error(data.message); 
            }

        } catch (error) {
            alert("আপলোড ব্যর্থ: " + error.message);
            if(label) {
                label.innerHTML = originalText;
                label.style.background = "#2196f3";
            }
        }
    }

function renderParticipants() {
    const gameFilter = document.getElementById('partGameSelector').value;
    const search = document.getElementById('partSearch').value.toLowerCase();
    const container = document.getElementById('partArea');
    const currentRole = SafeSession.getItem('role'); // লগিন রোল চেক
    
    let filteredList = participants.filter(p => p.name.toLowerCase().includes(search));
    if (gameFilter) filteredList = filteredList.filter(p => p.games.includes(gameFilter));
    
    let tableHTML = `<div class="table-responsive"><table>
        <thead>
            <tr>
                <th>প্রতিযোগীর নাম</th>
                <th>নথিভূক্ত ক্রীড়া</th>
                <th>সময়সূচী</th>
                <th style="text-align:center;">অ্যাকশন</th>
            </tr>
        </thead>
        <tbody>`;
        
    if(filteredList.length === 0) {
        tableHTML += `<tr><td colspan="4" style="text-align:center; color:gray;">কোনো তথ্য পাওয়া যায়নি</td></tr>`;
    } else {
        filteredList.forEach(p => {
            const gamesNames = p.games.map(g => gameConfig[g] ? gameConfig[g].label : g).join(', ');
            const dispName = p.name.includes('|') ? p.name.split('|')[1].trim() : p.name;
            
            // বিচারক হলে এডিট বাটন দেখাবে
            let editBtn = '';
            if(currentRole === 'admin') {
                editBtn = `<button onclick="openFullEditModal(${p.id})" style="background:none; border:none; font-size:22px; cursor:pointer;" title="এডিট করুন">✏️</button>`;
            }

            tableHTML += `<tr>
                <td style="font-weight:bold; color:var(--primary-color);">${dispName}</td>
                <td style="font-size:13px;">${gamesNames}</td>
                <td style="font-size:13px; color:var(--accent-color);">যথা সময়ে</td>
                <td style="text-align:center;">
                    ${editBtn}
                    <button onclick="openGenSlip(${p.id})" style="background:none; border:none; font-size:22px; cursor:pointer;" title="PDF স্লিপ">📄</button>
                </td>
            </tr>`;
        });
    }
    tableHTML += `</tbody></table></div>`;
    container.innerHTML = tableHTML;
}
function openGenSlip(id) {
    const p = participants.find(x => x.id === id);
    if(!p) return;
    
    const dispName = p.name.includes('|') ? p.name.split('|')[1].trim() : p.name;
    document.getElementById('genSlipRegNo').innerText = p.id;
    document.getElementById('genSlipName').innerText = dispName;
    document.getElementById('genSlipGames').innerText = p.games.map(g => gameConfig[g] ? gameConfig[g].label : g).join(', ');
    document.getElementById('genSlipDate').innerText = p.date ? p.date : new Date().toLocaleDateString('en-GB');
    
    const qrData = `ID:${p.id}|Name:${dispName}`;
    document.getElementById('genSlipQrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(qrData)}`;

    document.getElementById('genSlipModal').style.display = 'flex';
}

function downloadGenSlipPDF() {
    const printArea = document.getElementById("genSlipToPrint");
    const btn = event.target;
    const originalText = btn.innerText;
    btn.innerText = "অপেক্ষা করুন...";
    btn.disabled = true;

    html2canvas(printArea, { scale: 3, useCORS: true }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4" 
        });

        const pdfWidth = pdf.internal.pageSize.getWidth();
        const margin = 10; 
        const imgWidth = pdfWidth - (margin * 2);
        const imgHeight = (canvas.height * imgWidth) / canvas.width;

        pdf.addImage(imgData, 'PNG', margin, margin, imgWidth, imgHeight);
        
        const playerName = document.getElementById('genSlipName').innerText;
        pdf.save(`Slip_${playerName}_${Date.now()}.pdf`); 
        
        btn.innerText = originalText;
        btn.disabled = false;
    });
}

async function generateDrawingCertificate(pId, rank, btnElement) {
    const p = participants.find(x => x.id == pId);
    if(!p) {
        alert("খেলোয়াড়ের তথ্য পাওয়া যায়নি!");
        return;
    }

    const btn = btnElement;
    const originalText = btn ? btn.innerHTML : "🎖️";
    if(btn) {
        btn.innerHTML = "⏳";
        btn.disabled = true;
    }

    try {
        const template = document.getElementById('nyksCertTemplate');

        // ১. শুধু ইংরেজি নাম ফিল্টার করে নেওয়া
        const nameParts = p.name.split('|');
        const certName = nameParts[0].trim();

        // ২. Position ঠিক করা (1st, 2nd, 3rd, বা Participation)
        let posString = "Participation";
        if(rank === '1st' || rank === '১।') posString = '1st';
        else if(rank === '2nd' || rank === '২।') posString = '2nd';
        else if(rank === '3rd' || rank === '৩।') posString = '3rd';

        // ৩. টেক্সটগুলো টেমপ্লেটে বসানো
        document.getElementById('certNyksName').innerText = certName;
        document.getElementById('certNyksPos').innerText = posString;
        
        // Certificate Number তৈরি করা
        const certNo = "MSC-ART-2026-" + p.id;
        document.getElementById('certNyksNo').innerText = certNo;

        // ৪. QR Code জেনারেট করা
        const qrData = `Cert No: ${certNo}\nName: ${certName}\nRank: ${posString}\nDate: 24/03/2026\nOrg: Modern Sporting Club`;
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrData)}`;
        
        const qrImgElement = document.getElementById('certNyksQr');
        qrImgElement.src = qrUrl;

        // কিউআর কোড পুরোপুরি লোড হওয়ার জন্য অপেক্ষা করা
        await new Promise((resolve) => {
            if (qrImgElement.complete) resolve();
            else {
                qrImgElement.onload = resolve;
                qrImgElement.onerror = resolve; 
            }
        });

        // পিডিএফ বানানোর জন্য টেমপ্লেটটি ব্যাকগ্রাউন্ডে শো করানো
        template.style.display = 'block';

        // ৫. A3 Size + 600 DPI এর জন্য Scale Factor: 4 রাখা হয়েছে
        const canvas = await html2canvas(template, { 
            scale: 4, 
            useCORS: true, 
            allowTaint: true,
            logging: false,
            backgroundColor: "#ffffff"
        });
        
        const imgData = canvas.toDataURL('image/jpeg', 1.0); 
        
        // ৬. A3 সাইজে PDF সেভ করা (Landscape)
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('l', 'mm', 'a3'); 
        
        const pdfWidth = pdf.internal.pageSize.getWidth(); 
        const pdfHeight = pdf.internal.pageSize.getHeight(); 
        
        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`NYKS_Certificate_${certName.replace(/\s+/g, '_')}.pdf`);
        
    } catch (error) {
        console.error("PDF Error:", error);
        alert("সার্টিফিকেট তৈরি করতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন চেক করুন।");
    } finally {
        // কাজ শেষে আবার লুকিয়ে রাখা
        document.getElementById('nyksCertTemplate').style.display = 'none';
        if(btn) {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }
}
